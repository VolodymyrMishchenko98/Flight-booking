{% extends "flights/base.html" %}

{% block title %}Profile - SkyDesk{% endblock %}

{% block content %}
<section class="confirmation-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="booking-panel">
                    <h1 class="mb-4">Your profile</h1>
                    <div class="detail-grid">
                        <div>
                            <span>Username</span>
                            <strong>{{ user.username }}</strong>
                        </div>
                        <div>
                            <span>Email</span>
                            <strong>{{ user.email }}</strong>
                        </div>
                        <div>
                            <span>First name</span>
                            <strong>{{ user.first_name|default:"-" }}</strong>
                        </div>
                        <div>
                            <span>Last name</span>
                            <strong>{{ user.last_name|default:"-" }}</strong>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a class="btn btn-primary w-100" href="{% url 'flights:flight_list' %}">Back to flights</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
