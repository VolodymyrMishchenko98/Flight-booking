services:
  - type: web
    name: skydesk
    env: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "skydesk.onrender.com,localhost,127.0.0.1"
      - key: WEB_CONCURRENCY
        value: "4"
    plan: free
